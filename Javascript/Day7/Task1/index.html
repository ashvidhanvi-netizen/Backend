<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task1</title>
</head>
<body>
    <script>

        let mark = 70;

        const result = new Promise ((resolve , reject) => {

            if (mark >= 35){

                resolve("Student Passed");
                
            } else {

                reject("Student Failed");
                
            }

        })

        result.then ((pass)=>{
            console.log(pass);
        })

        .catch ((error)=>{
            console.log(error);
            

    })
    </script>
    
</body>
</html>
