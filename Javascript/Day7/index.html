<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promises</title>
</head>
<body>

    <script>

        const myPromise = new Promise ((resolve,reject)=>{
             
            let num = 5
            
            if (num %2 === 0){
                resolve("Even")
            } else {
                reject ("odd")
            }
              })
            

            myPromise.then((result)=>{
                console.log(result);
            }).catch((error)=>{
                console.log(error);
                
            })
            


      

       
    </script>
    
</body>
</html>
